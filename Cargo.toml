[package]
name = "rtree"
version = "0.1.0"
edition = "2021"

[dependencies]
ansiterm = "0.12.2"
clap = "4.5.31"
error-chain = "0.12.4"
walkdir = "2.5.0"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
